<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#03050d" />
    <title>Drone Dreams</title>
  </head>
  <body>
    <main id="app" aria-label="Drone Dreams visual demo">
      <canvas id="stage"></canvas>
      <section id="enter-panel" class="enter-panel" role="dialog" aria-modal="true" aria-labelledby="enter-title">
        <div class="enter-panel__card">
          <h1 id="enter-title" class="opening-title-label">
            <span data-text="Drone">Drone</span>
            <span data-text="Dreams">Dreams</span>
          </h1>
          <button id="enter-button" class="enter-panel__button" type="button">click to enter</button>
        </div>
      </section>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
